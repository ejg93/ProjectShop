# 배포가 읽는 Dockerfile 둘이 실제로 이미지가 되는지 본다(청크 `Q117`).
#
# **`점검 S` 가 찾았다**(2026-09-20). 배포의 첫 단계가 「호스팅이 이 파일로 이미지를 만든다」인데
# 워크플로에도 스크립트에도 `docker build` 가 없어서 **한 번도 증명된 적이 없었다.**
# 그날 손으로 재서 둘 다 됐고, **다음에 깨지는 것을 보는 자리**가 이 파일이다 —
# 의존성·기본 이미지·산출물 경로가 바뀌면 그때까지는 배포에서야 알았다.
#
# **`ci.yml` 에 안 넣는다**(선택지 ②). 청크마다 2~4분이 붙는데 이 둘이 깨지는 것은
# 위 셋이 바뀔 때뿐이라 청크마다 바뀌지 않는다. **PR 이 마무리 때 한 번뿐이라**(`2g-4`)
# `e2e.yml` 과 같은 리듬이 된다.
#
# **그 대신 이 게이트는 청크마다 도는 것들보다 늦다.** 깨진 것을 다음 마무리에서야 안다 —
# 청크당 2~4분을 안 내는 값으로 그 늦음을 산 것이고, 그것이 이 선택의 맞바꿈이다.
name: Docker

on:
  pull_request:
  # 손으로도 건다. PR 을 안 열고 가지에서 확인하고 싶을 때 쓴다.
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # 빌드 문맥이 `backend/` 다 — 호스팅이 Root Directory 를 그렇게 준다.
      # 태그는 여기서만 쓰고 안 밀어낸다. 이 잡이 묻는 것은 「이미지가 되나」 하나다.
      - run: docker build -t projectshop-backend:ci backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # **`BACKEND_ORIGIN` 을 안 주면 빌드가 선다**(`Q116` 의 강제 지점).
      # `verify-proxy-target.mjs` 가 루프백도 거부하므로 배포와 같은 모양의 사설 주소를 준다 —
      # 여기서 부를 백엔드는 없고, 재는 것은 **산출물에 굳은 목적지**라 호출이 필요 없다.
      - run: docker build --build-arg BACKEND_ORIGIN=http://backend.ci.internal:8080 -t projectshop-frontend:ci frontend

      # **빌드가 네트워크를 안 탄다**(`Q214`, `D25`). 글꼴을 `next/font/google` 로 받던 때는 구글을 못 부르면
      # 빌드 전체가 죽었다(PR #77·#79). 절차는 스크립트 한 곳이다 — 로컬 탐침(`gate-probe.sh offline-build`)이 같은 것을 부른다.
      - name: next build 가 네트워크 없이 된다
        run: bash scripts/offline-build.sh
