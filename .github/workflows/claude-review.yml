# PR 마다 리뷰를 돌린다. `ci.yml` 이 「돌렸나」를 사람 기억에서 걷어냈다면
# 이쪽은 「규약대로 쳤나」를 걷어낸다.
#
# **리뷰는 게이트가 아니다.** 조언이라 아무것도 못 막는다 — 막는 것은 `ci.yml` 이고,
# 이 워크플로의 산출물은 **리뷰가 반복해서 잡는 것**이다. 그 목록이 테스트·`doc-lint.sh` 로
# 내려갈 후보고, 무엇을 내릴지는 `D25`(품질 게이트 기준)가 정한다.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize]

# 앞 회차를 접는다. 청크 하나를 여러 번 밀 때 리뷰가 겹쳐 돌 이유가 없다.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # **dependabot 이 연 PR 은 안 본다.** 바뀌는 것이 버전 숫자 하나라
    # 이 리뷰가 묻는 넷(말한 축·강제 지점·결정 충돌·문서 참조)에 물을 것이 없다.
    # 그 PR 을 판정하는 것은 CI 고, 실제로 첫 회차에서 넷을 빨갛게 잡았다.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # **20 에서 올렸다**(`2g-7`). 아래 `--disallowedTools` 가 도우미를 걷어서 리뷰가 혼자 다 본다 —
    # 청크가 늘면 시간도 같이 는다. 실측 네 회차가 4분 50초·6분 33초·10분 27초·11분 48초고
    # 제일 긴 것이 청크 여섯짜리 PR #48 이다(청크당 약 2분). 20 이면 청크 열에서 닿는다.
    # **상한은 「여기까지 기다린다」지 「여기까지 돈다」가 아니라** 안 쓰는 10분에 값이 안 붙는다.
    # 대신 리뷰가 진짜로 멈췄을 때 알아채는 것이 10분 늦다.
    timeout-minutes: 30
    permissions:
      # `ci.yml` 과 같이 읽기만 준다(`D14`). 리뷰는 코멘트만 달고 코드를 안 고친다.
      # **PR 여섯에서 이 권한으로 돌았고 안 죽었다**(2026-09-05). 액션 문서의 예시는
      # `contents: write` 지만 코멘트만 다는 데는 필요 없다. 넓혀야 할 일이 생기면 여기 적는다.
      contents: read
      pull-requests: write
      issues: write
      # OIDC 토큰을 받는 자리다. 액션 문서가 필수로 적었다.
      id-token: write
    # 시크릿이 아직 없으면 조용히 건너뛴다. 없다고 PR 마다 빨간 것이 하나 뜨면
    # 그 빨강이 진짜 실패를 가린다 — 「지금 깨져 있는 것」이 우선순위 1번인 이유다.
    env:
      REVIEW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: env.REVIEW_TOKEN != ''
        with:
          # 리뷰가 「이 청크가 무엇을 바꿨나」를 보려면 갈라진 자리까지 필요하다.
          # 얕게 받으면 base 와 비교할 것이 없다.
          fetch-depth: 0

      # **회차 시작 시각을 박는다**(`2g-6`). 아래 확인 step 이 「**이번 회차가** 코멘트를 남겼나」를
      # 보려면 기준 시각이 있어야 한다. 그전에는 개수만 세서 **옛 회차의 코멘트로 통과했다** —
      # PR #45 의 12:09·15:31 두 회차가 08:47 에 달린 코멘트 하나를 세고 둘 다 초록이었다.
      - name: 회차 시작 시각
        if: env.REVIEW_TOKEN != ''
        run: echo "ROUND_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # **훅 파일을 지우던 step 을 뺐다**(`2g-6`, 2026-09-14 실측). 그 step 은 `.claude/settings.json`
      # 의 Stop 훅(검증 도장·미커밋 검사)이 리뷰 세션에서 도는 것을 막으려던 것인데(마무리 13차, PR #41),
      # **액션이 `.claude` 를 `origin/main` 에서 되살리는 것이 18초 뒤다** — run 34862668434 에서
      # 15:31:15 에 지우고 15:31:33 에 「Restoring .claude … (PR head is untrusted)」가 찍혔다.
      # 지운 것이 그대로 돌아왔고 훅은 그 회차에서도 돌았다.
      #
      # **안 걸리는 step 을 남겨 두면 「막고 있다」고 읽힌다** — 이 저장소가 네 번 밟은 자리다.
      # 훅은 아래 `claude_args` 의 `--setting-sources user` 가 끈다.

      - id: review
        uses: anthropics/claude-code-action@v1
        if: env.REVIEW_TOKEN != ''
        with:
          # 구독 토큰을 쓴다. 이 저장소의 전제가 「주간 토큰이 남을 때 태운다」라
          # 별도 과금(`ANTHROPIC_API_KEY`)을 새로 여는 것이 앞뒤가 안 맞는다.
          # 발급은 로컬에서 `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # **`use_sticky_comment` 를 뺐다**(`2g-5`, PR #37 실측). 그 설정은 **액션 자신이 다는
          # 코멘트**를 재활용하는 것인데, 이 워크플로는 **프롬프트가 `gh pr comment` 로 직접 단다** —
          # 경로가 달라서 켜 두어도 아무것도 안 걸렸다. 실제로 회차 둘에 코멘트가 둘 붙었다.
          #
          # 겹침은 프롬프트 쪽에서 막는다: `gh pr comment --edit-last --create-if-none`.
          # **안 걸리는 설정을 켜 두면 「막고 있다」고 읽힌다** — 그게 이 저장소가 세 번 밟은 자리다.

          # **거부 목록을 읽으려고 켰었다**(`2g-5` 판정표). PR #36 에서 `claude_args` 로 도구 셋을
          # 열었는데도 `permission_denials_count` 가 **다시 12** 였고 코멘트는 0개였다 —
          # `is_error: false` 라 실행은 성공으로 보인다. **무엇이 거부됐는지를 액션이 가려서**
          # (`full output hidden for security`) 무엇을 더 열어야 하는지 추측할 수밖에 없었다.
          #
          # **추측으로 도구를 더 열지 않는다** — 재고 고친다(`2e-1`·`Q21` 과 같은 방법).
          # **읽었고 껐다**(`Q114`, 2026-09-19). 목록은 `2g-5` 에서 읽어 아래 `--allowedTools` 셋을 열었고,
          # 그 뒤 여덟 PR 이 켜진 채로 지나갔다 — 공개 저장소 로그에 리뷰 본문이 통째로 남았고
          # 「안 걸리는 설정을 켜 두면 막고 있다고 읽힌다」와 같은 자리였다.
          # **다시 켜는 조건**: 확인 step 이 빨갛고 로그의 `permission_denials_count` 가 0 이 아닐 때, 한 회차만 켜서 읽고 도로 끈다.
          # **이 파일을 고친 PR 에서는 액션이 안 돈다**(`2g-3`) — 껐는지는 그다음 PR 의 로그가 답한다.
          show_full_output: false

          # **액션은 Bash 를 기본으로 안 준다**(`2g-5`). 공식 문서: 「By default, Claude cannot
          # execute Bash commands unless explicitly allowed」. 그래서 프롬프트가 시킨 `gh pr comment`
          # 가 **PR 여섯에서 매번 거부됐다** — 로그의 `permission_denials_count` 가 12~22 였고
          # 코멘트는 0개였다. 실행은 `is_error: false` 라 성공으로 보였다.
          #
          # 여는 것은 공식 예제의 셋뿐이다. **인라인 코멘트 도구는 안 연다** — 아래 프롬프트가
          # 묻는 넷이 줄 단위가 아니라 PR 단위라, 줄에 흩어지면 처분할 목록(`D25`)이 안 된다.
          #
          # **`--setting-sources user` 가 저장소 훅을 끈다**(`2g-6`, 2026-09-14 로컬 실측).
          # 액션이 `origin/main` 에서 `.claude` 를 되살리므로 파일을 지우는 것으로는 못 끈다 —
          # 리뷰어가 **읽지 않게** 해야 한다. 이 플래그는 `user` 스코프만 읽고 `project`·`local` 을 버린다.
          #
          # **`settings` 입력(`{"hooks":{}}`)은 안 된다.** 세 변형(`{}`·`{"Stop":[]}`·`{"Stop":null}`)을
          # 로컬에서 재 봤고 전부 훅이 그대로 돌았다 — CLI 의 `--settings` 는 도움말대로
          # 「load **additional** settings」라 **더하기만 하고 못 지운다.** CI 회차를 안 태우고 갈랐다.
          #
          # 버리는 것이 훅뿐이다: 이 저장소의 `.claude/settings.json` 은 최상위 키가 `hooks` 하나다.
          # 거기에 키가 늘면 이 줄을 다시 본다.
          #
          # **`--disallowedTools` 가 도우미를 걷는다**(`2g-7`, 2026-09-17 로컬 실측). 리뷰어가
          # 청크마다 서브에이전트를 띄우고 **결과를 안 받은 채 세션을 끝내는 것**이 두 번 났다 —
          # run 34862668434(열을 띄우고 일곱만 받았다)과 run 35077299175(넷을 띄우고 `completed: 0`,
          # 결과 문장이 「4개 에이전트가 모두 실행 중이다」). 둘 다 코멘트가 0개고 `is_error: false` 다.
          # 아래 프롬프트가 그것을 **글로** 금지하고 있었는데 두 번째가 났다 — 문서는 5위라 안 막는다.
          #
          # **막아도 잃는 것이 없다.** 초록이었던 회차 넷이 전부 `by_type: {}` 다 —
          # 도우미를 하나도 안 띄우고 혼자 보고 코멘트를 달았다. 띄운 회차는 죽은 그 하나뿐이다.
          #
          # **이름 둘을 같이 적는다.** 지금 CLI 는 `Agent` 고 `Task` 는 옛 이름인데, 액션이 버는
          # CLI 판이 어느 쪽인지 여기서 못 고정한다. 없는 이름은 무해하고
          # **있는 이름을 빠뜨리면 안 막는데 막는 것처럼 읽힌다.**
          claude_args: |
            --setting-sources user
            --disallowedTools "Task,Agent"
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

          # **모델을 안 고정한다.** `claude-sonnet-5` 를 박았더니 초기화 직후 `is_error` 로 죽었다 —
          # `num_turns: 1`·`modelUsage: {}` 라 **첫 호출이 거부된 것**이고, 실제 메시지는
          # 액션이 가린다(`full output hidden for security`). 액션이 고르는 기본값을 쓴다.

          # **일반 리뷰는 이 저장소의 규약을 모른다.** 무엇을 볼지 여기서 정한다.
          # 아래 넷은 「마무리」의 일곱 대조 중 **기계가 못 잡고 사람이 놓치는 것**들이다.
          prompt: |
            PR 번호: ${{ github.event.pull_request.number }}

            이 저장소의 `CLAUDE.md` 와 `doc/reference/` 규약을 기준으로 이 PR 을 검토한다.
            먼저 `CLAUDE.md` 를 읽고, 이 PR 이 실제로 건드리는 D 문서만 편다.
            통짜로 읽지 않는다.

            먼저 `gh pr view <위 PR 번호> --json body` 로 본문을 읽는다 — 청크마다 **시작 세 줄**
            (무엇을 닫나·걸리는 축·강제 지점)이 있고, 그것이 아래 1번의 입력이다.
            diff 는 `gh pr diff <위 PR 번호>` 다.

            아래 넷에 **청크마다** 답한다. 답은 「예」·「아니오 — 근거」·「모름 — 왜」 셋 중 하나고,
            근거는 `파일:줄` 과 **어느 규칙의 어느 절**이다. 출처를 못 대면 「아니오」가 아니라 「모름」이다.
            이 넷은 빌드·테스트가 초록이어도 안 걸리는 것들이다.

            1. **말한 축을 실제로 폈나** — 시작 세 줄이 「법」이라 했으면 diff 에 그 조문·`D2` 의 R번호가
               닿았나. 「제약으로 내린다」고 했으면 마이그레이션에 제약이 섰나, 테스트로 끝났나.
            2. **강제 지점을 더 아래로 내릴 수 있었나** — `coding-rules.md` 「축 2」의 순서다
               (타입·스키마 > DB 제약 > 앱 검증 > 테스트 > 문서).
               테스트로 막은 것이 제약으로 내려갈 수 있으면 그 자리를 짚는다.
            3. **이 PR 안의 결정끼리 부딪치나** — 한 자리에 넣은 규칙을 짝이 되는 자리에
               안 넣었나(예: `create` 에만 넣고 `replace` 에 안 넣은 저장). 청크 A 가 정한 값을 청크 B 가 어기나.
            4. **문서가 부르는 것이 실물과 맞나** — 바뀐 문서가 가리키는 청크 번호·클래스·
               테스트 이름·마이그레이션 번호·스크립트 경로가 실재하나. **파일을 실제로 열어 확인한 것만 「예」다** — 셸은 `gh` 셋만 열려 있으니(`claude_args`) 파일은 읽기 도구로 연다.

            출력은 **표 하나**다 — 행은 청크, 열은 위 넷. 표 아래에 「아니오」만 다시 모아
            `파일:줄 — 무엇 — 어느 규칙` 으로 적는다. 칭찬은 안 쓴다. 전부 「예」면 표만 남긴다.

            글은 평서형으로 쓴다(`CLAUDE.md` 「글 작성 규칙」 4번). `~습니다`·`~합니다` 를 안 쓴다.

            **코멘트 본문의 첫 줄은 정확히 `<!-- claude-review -->` 다.** 그 뒤에 검토 결과를 쓴다.
            아래 확인 step 이 그 마커로 「리뷰가 무언가를 내놓았나」를 판정한다. 작성자 이름으로
            안 세는 이유는 토큰 종류에 따라 `claude[bot]`·`github-actions[bot]` 로 갈려서다.

            **검토가 끝나면 그 결과를 이 PR 의 코멘트로 남긴다** —
            `gh pr comment <위 PR 번호> --edit-last --create-if-none --body "<본문>"`.
            로그에만 있으면 아무도 안 읽는다. 첫 실행이 실제로 그랬다: 검토는 됐는데
            코멘트를 안 달아서 사람이 로그를 파야 했다.

            **파일을 만들지 않는다.** `--body-file` 을 쓰려면 파일을 먼저 써야 하는데
            그 도구가 안 열려 있다 — PR #37 에서 그것 때문에 **거부가 19건** 났고,
            결국 `--body` 로 우회해서야 코멘트가 달렸다(`2g-5`). 시킨 길이 막혀 있었던 것이라
            **되는 길을 시킨다.** 본문에 백틱과 따옴표가 많으니 셸 인용에 주의한다.

            **`--edit-last` 로 한 코멘트를 고쳐 쓴다.** 회차마다 새로 달면 PR 하나에 여러 개가 쌓인다 —
            워크플로의 `use_sticky_comment` 는 **액션 자신의 코멘트**를 관리하는 것이라
            여기서 `gh` 로 직접 다는 코멘트에는 안 걸린다(PR #37 에서 둘이 붙었다).

            **혼자 본다.** 서브에이전트 도구는 `claude_args` 가 걷어서 이 세션에 없다 —
            띄우려 하지 말고 청크를 순서대로 직접 읽는다. 상한은 30분이다.

            **코멘트를 달기 전에 세션을 끝내지 않는다.** 시간이 모자라면 본 만큼으로 표를 채우고
            못 본 청크를 「모름 — 왜」로 적은 뒤 단다.
            **아무것도 안 단 채로 끝나는 것이 가장 나쁜 결과다.**

      # **리뷰가 아무것도 안 내놓으면 여기서 빨개진다**(`2g-5`).
      #
      # 리뷰 내용은 여전히 조언이라 아무것도 못 막는다 — 이 step 이 보는 것은 **출력이 있나** 하나다.
      # 그전에는 PR 열하나에서 코멘트가 0개인데 잡이 초록이었다: 아무것도 안 내놓는 5~7분은
      # 게이트도 조언도 아니고, 그것을 알아채는 데 PR 여섯이 걸렸다.
      #
      # **액션이 안 돌았으면 요구하지 않는다.** 이 워크플로 파일을 고치는 PR 에서는
      # 액션이 자기 파일을 `main` 과 대조하고 **조용히 건너뛴다**(`2g-3`) — 그런데 step 자체는
      # `success` 라 겉에서는 안 갈린다. 실제로 PR #30 에서 이 step 이 그것을 「코멘트 없음」으로
      # 읽고 빨개졌다. **`execution_file` 이 비어 있으면 안 돈 것**이라 그때는 통과시킨다.
      #
      # 마커로 센다. 작성자 이름은 토큰 종류에 따라 `claude[bot]`·`github-actions[bot]` 로 갈린다.
      #
      # **이번 회차 것만 센다**(`2g-6`). 개수만 세던 때는 **옛 코멘트로 통과했다** —
      # PR #45 의 12:09·15:31 회차가 둘 다 코멘트를 0개 남겼는데 08:47 의 것을 세고 초록이었다.
      # **빈 초록은 빨강보다 나쁘다**: 리뷰가 죽은 것을 초록이 가린다.
      #
      # `gh pr view` 대신 REST 를 쓴다 — 그쪽 `comments` 에는 `updatedAt` 이 없고,
      # `--edit-last` 로 고쳐 쓰면 `createdAt` 이 첫 회차에 머물러서 새 회차를 못 가른다.
      # ISO-8601 Z 는 사전순이 곧 시간순이라 문자열로 비교한다.
      - name: 리뷰가 이번 회차에 코멘트를 남겼나
        if: env.REVIEW_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        run: |
          if [ -z "$EXECUTION_FILE" ]; then
            echo '리뷰가 안 돌았다. 이 워크플로를 고치는 PR 이면 정상이다(2g-3) — 액션이 자기 파일을 main 과 대조해 건너뛴다'
            exit 0
          fi
          # **개수를 안 세고 줄을 센다**(마무리 17차 독립 리뷰). `--paginate` 는 jq 필터를
          # **페이지마다 따로** 돌리므로 `| length` 를 쓰면 페이지 수만큼 숫자가 줄로 나온다 —
          # 코멘트가 100개를 넘는 PR 에서 `n` 이 `"0\n1"` 이 되고 `[ "$n" -ge 1 ]` 가
          # `integer expression expected` 로 떨어져 **코멘트를 남겨도 항상 빨개진다.**
          # 한 줄에 하나씩 뱉고 `wc -l` 로 세면 페이지가 몇이든 맞는다.
          # (`--slurp` 는 `--jq` 와 같이 못 쓰고, `jq` 바이너리에 기대지 않는 편이 낫다.)
          n=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
                --paginate \
                --jq ".[] | select(.body | startswith(\"<!-- claude-review -->\")) | select(.updated_at >= \"${ROUND_START}\") | .id" \
              | wc -l | tr -d ' ')
          if [ "$n" -ge 1 ]; then
            echo "이번 회차(${ROUND_START} 뒤) 리뷰 코멘트 $n 건"
            exit 0
          fi
          echo "리뷰가 이번 회차에 코멘트를 안 남겼다(2g-6). 회차 시작: ${ROUND_START}" >&2
          echo '로그에서 볼 것: permission_denials_count · result 의 마지막 문장 · 서브에이전트를 기다리다 끝났나' >&2
          exit 1