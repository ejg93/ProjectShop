# 커밋마다 검증을 돌린다. CLAUDE.md 「검증」 표가 청크 닫힘 조건으로 정한 명령을 그대로 옮긴 것이다.
#
# 이 워크플로가 하는 일은 「돌렸나」를 사람 기억에서 걷어내는 것 하나다.
# 손으로 돌리는 검증은 바쁠 때 건너뛰고, 건너뛴 것은 아무 데도 안 남는다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 손으로도 걸 수 있게 둔다. 실패를 재현할 때 커밋을 새로 만들지 않아도 된다.
  workflow_dispatch:

# 같은 가지에 커밋이 연달아 오면 앞 회차를 접는다. 마지막 커밋의 결과만 뜻이 있다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 읽기만 한다(`D14`). 기본값은 저장소 설정을 따라가는데, 워크플로가 쓰기를 받을 이유가 없다.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # build.gradle.kts 의 툴체인과 같은 값이다. 여기만 올리면 툴체인이 JDK 를 따로 받는다.
          java-version: '25'

      # Gradle 캐시와 래퍼 검증을 같이 한다. 래퍼 jar 이 바뀌면 실패시키는 것이 이 액션의 기본값이다.
      - uses: gradle/actions/setup-gradle@v4

      # Postgres 를 service 컨테이너로 안 띄운다. 테스트가 Testcontainers 로 스스로 띄우고
      # (`PostgresTestBase`) 러너에는 Docker 가 이미 있다. 두 군데서 띄우면 어느 DB 에
      # 붙었는지가 실행마다 달라진다.
      - run: ./gradlew build
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Next 16 이 요구하는 하한(20.9)보다 위의 LTS 다.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # install 이 아니라 ci 다. 잠금 파일과 어긋나면 조용히 맞추지 않고 실패해야 한다.
      - run: npm ci

      # 셋 다 CLAUDE.md 「검증」 표에 있는 명령이다. build 에 타입 검사가 같이 돈다.
      - run: npm run build
      - run: npm run lint
      - run: npm test
