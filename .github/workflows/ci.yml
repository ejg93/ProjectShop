# 커밋마다 검증을 돌린다. CLAUDE.md 「검증」 표가 청크 닫힘 조건으로 정한 명령을 그대로 옮긴 것이다.
#
# 이 워크플로가 하는 일은 「돌렸나」를 사람 기억에서 걷어내는 것 하나다.
# 손으로 돌리는 검증은 바쁠 때 건너뛰고, 건너뛴 것은 아무 데도 안 남는다.
name: CI

on:
  # **모든 가지에서 돈다**(`2g-4`). PR 은 이제 마무리 때 한 번만 열어서, 가지 제한을 두면
  # 청크 다섯을 리눅스 검증 없이 치게 된다 — `2c` 가 세운 값(로컬 Windows 가 못 잡는 종류)이
  # 통째로 사라진다. 아래 `concurrency` 가 같은 가지의 앞 실행을 취소해서 낭비를 막는다.
  push:

  # **`pull_request:` 를 뺐다**(`2c-3`, 사용자 선택). `push` 와 `pull_request` 가 둘 다 있으면
  # **같은 커밋을 두 번 검사한다** — PR #37 의 커밋 하나에 `ci.yml` 2건·`codeql.yml` 2건이 실측됐다.
  # 아래 `concurrency` 가 그것을 못 막는다: 그룹 키가 `github.ref` 인데 push 는 `refs/heads/…`,
  # PR 은 `refs/pull/N/merge` 라 **다른 그룹**이다.
  #
  # **필수 검사는 그대로 찬다.** 가지 보호가 이름(`context`)과 앱(`app_id: 15368`)으로 맞추고
  # **이벤트를 안 가린다** — push 실행이 같은 커밋에 같은 이름으로 결과를 붙인다.
  #
  # **fork PR 은 push 가 안 돈다.** 이 저장소는 fork 가 없어서 지금은 해당 없지만,
  # 바깥에서 PR 을 받기 시작하면 **이 줄을 되돌려야 한다.**
  # 손으로도 걸 수 있게 둔다. 실패를 재현할 때 커밋을 새로 만들지 않아도 된다.
  workflow_dispatch:

# 같은 가지에 커밋이 연달아 오면 앞 회차를 접는다. 마지막 커밋의 결과만 뜻이 있다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 읽기만 한다(`D14`). 기본값은 저장소 설정을 따라가는데, 워크플로가 쓰기를 받을 이유가 없다.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # build.gradle.kts 의 툴체인과 같은 값이다. 여기만 올리면 툴체인이 JDK 를 따로 받는다.
          java-version: '25'

      # Gradle 캐시와 래퍼 검증을 같이 한다. 래퍼 jar 이 바뀌면 실패시키는 것이 이 액션의 기본값이다.
      - uses: gradle/actions/setup-gradle@v6

      # Postgres 를 service 컨테이너로 안 띄운다. 테스트가 Testcontainers 로 스스로 띄우고
      # (`PostgresTestBase`) 러너에는 Docker 가 이미 있다. 두 군데서 띄우면 어느 DB 에
      # 붙었는지가 실행마다 달라진다.
      - run: ./gradlew build
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Next 16 이 요구하는 하한(20.9)보다 위의 LTS 다.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # install 이 아니라 ci 다. 잠금 파일과 어긋나면 조용히 맞추지 않고 실패해야 한다.
      - run: npm ci

      # 들여온 것에 알려진 취약점이 있나(청크 `2e-3`). **high 이상이면 빨강.**
      #
      # 문턱의 근거는 2026-09-06 측정이다 — 그날 `npm audit` 이 info 부터 critical 까지 전부 0이었다.
      # **누를 기준선이 없어서 처음 나오는 것부터 처분한다**(`D25`). SpotBugs·CodeQL 과 같은 꼴이다.
      #
      # **Gradle 쪽은 여기서 안 본다.** 잠금 파일이 없어 같은 방식이 안 되고,
      # 대신 `dependency-submission.yml` 이 그래프에 올려 Dependabot 경보가 본다 —
      # 그쪽은 알려 주기만 하고 막지는 않는다.
      - run: npm audit --audit-level=high

      # 셋 다 CLAUDE.md 「검증」 표에 있는 명령이다. build 에 타입 검사가 같이 돈다.
      - run: npm run build
      - run: npm run lint
      - run: npm test

  # 시크릿이 커밋에 들어갔나(청크 `2e`). backend·frontend 와 독립이라 같이 돈다.
  #
  # **이건 두 번째 그물이다.** 첫째는 GitHub 의 push protection 인데 그건 저장소 설정이라
  # 코드가 아니고, 아는 제공자의 토큰 모양만 본다. gitleaks 는 더 넓게 보지만
  # **푸시된 뒤에야 답한다** — 이미 원격에 남은 것을 알려 주는 것이지 막는 것이 아니다.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # 이력 전체를 본다. 얕게 받으면 **예전 커밋에 박힌 것**을 못 찾는다.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 프롬프트 역할 문서가 구조적으로 부서졌나(청크 `2c-1`).
  #
  # **「검증」 표가 이미 이 명령을 정해 뒀다** — 여기서 새로 정하는 것이 없고 **도는 자리만 옮긴다.**
  # 로컬에서만 돌던 동안은 사람이 기억해야 걸려서 강제 지점 5위였다.
  #
  # backend·frontend 와 독립이라 같이 돈다. 스크립트가 순수 bash·awk 라 러너에 이미 있다.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 얕게 받는다. 파일 내용만 보고 이력은 안 본다.
      - uses: actions/checkout@v7

      - run: bash scripts/doc-lint.sh

      # 리포트다. 안 빨개진다(`2v`) — 테스트가 안 부르는 R 목록을 로그에 남긴다.
      - run: bash scripts/req-coverage.sh
