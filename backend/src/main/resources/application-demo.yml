# 보여 주려고 올린 배포가 쓰는 프로필(`Q134`).
#
# 켜는 법: 호스팅 쪽 환경변수 `SPRING_PROFILES_ACTIVE=demo`.
#
# 여기서 하는 일은 하나뿐이다 — 데모 데이터를 Flyway 의 대상에 더한다.
# `application-local.yml` 과 지금은 내용이 같지만 **파일을 하나로 안 합친다.**
#
# 저 파일은 「손으로 확인할 때」의 것이라 언제든 로컬 편의 설정이 붙는다
# (지금도 「다른 설정을 여기 넣지 않는다」고 스스로 못을 박아 두었지만, 그것은 약속이지 제약이 아니다).
# 합쳐 두면 그렇게 붙은 설정이 **올라간 사이트에 같이 실린다** — 그때 깨지는 것은
# 아무도 안 돌려본 조합이고, 안 돌려본 설정은 깨져 있다(`D16`).
#
# 기본 프로필은 `db/migration` 만 본다. 그래서 이 변수를 안 주면 `V900+` 가 통째로 안 돈다 —
# `Q130` 이 만든 계정 아홉과 `Q128` 의 재고가 배포된 DB 에 안 생긴다.
spring:
  flyway:
    # 기본 location 을 다시 적어야 한다. 이 키는 합쳐지지 않고 덮어쓴다.
    locations: classpath:db/migration,classpath:db/seed,classpath:db/seed-demo
    # **시드보다 번호가 낮은 새 마이그레이션을 받는다**(`Q199`). 시드가 `V900` 대라, 시드를 이미 받은 DB 에
    # 뒤에 온 `V82` 같은 것은 「순서가 어긋났다」가 되고 Flyway 가 기동을 막는다 — 배포가 #70~#74 동안
    # 그렇게 못 올라갔다. 빈 DB 에서는 시드가 늘 맨 뒤라 이 설정이 아무것도 안 바꾼다. `SeededUpgradeTest` 가 잰다.
    out-of-order: true
