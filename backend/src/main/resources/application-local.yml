# 로컬에서 손으로 확인할 때 쓰는 프로필.
#
# 켜는 법: ./gradlew bootRun --args='--spring.profiles.active=local'
#
# 여기서 하는 일은 하나뿐이다 — 데모 데이터를 Flyway 의 대상에 더한다.
# 다른 설정을 여기 넣지 않는다. 프로필마다 설정이 갈리면 안 돌려본 조합이 생기고,
# 안 돌려본 설정은 깨져 있다(`D16`).
shop:
  seed:
    # **시드는 스키마와 다른 이력 표로 붓는다**(`Q200`) — `SeedMigrationStrategy` 가 스키마 뒤에 이 위치를 `flyway_seed_history` 로 돌린다.
    # 그전에는 `spring.flyway.locations` 에 시드를 더하고 `out-of-order` 를 켜 두었다(`Q199`) — 그 설정은 진짜 순서 사고도 통과시켰다.
    locations: classpath:db/seed
