# 검증 칸 문구(`Q238`). 화면이 칸 옆에 그대로 그리므로 화면 문구다 — 한국어 존댓말 한 벌, 끝에 마침표 없음(`screen-rules.md`).
# 요청 언어는 `spring.web.locale-resolver: fixed` 가 굳힌다. 영어 로케일에서도 이 파일이 Hibernate Validator 의 기본 문구를 이긴다.
# main 이 쓰는 제약 종류마다 열쇠가 있어야 한다 — `ValidationMessageTest` 가 잰다.
#
# `Size` 는 식이다 — 상한만·하한만·둘 다를 한 문구로 가른다. 식 안에 `{min}` 꼴을 넣으면 안 풀린다(HV000169).
jakarta.validation.constraints.NotBlank.message=필수 입력입니다
jakarta.validation.constraints.NotNull.message=필수 입력입니다
jakarta.validation.constraints.NotEmpty.message=하나 이상 넣어 주세요
jakarta.validation.constraints.Size.message=${max == 2147483647 ? min += '자 이상 입력해 주세요' : (min == 0 ? max += '자 이하로 입력해 주세요' : min += '자 이상 ' += max += '자 이하로 입력해 주세요')}
jakarta.validation.constraints.Min.message={value} 이상이어야 합니다
jakarta.validation.constraints.Max.message={value} 이하여야 합니다
jakarta.validation.constraints.Positive.message=0보다 커야 합니다
jakarta.validation.constraints.PositiveOrZero.message=0 이상이어야 합니다
jakarta.validation.constraints.Email.message=이메일 주소 형식이 아닙니다
jakarta.validation.constraints.Pattern.message=형식이 올바르지 않습니다
jakarta.validation.constraints.Past.message=지난 날짜여야 합니다
