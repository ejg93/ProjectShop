services:
  db:
    image: postgres:17-alpine
    container_name: shop-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # 확장을 미리 적재한다(`42-0`). `shared_preload_libraries` 는 기동 인자라야 먹는다 —
    # `create extension` 만으로는 뷰를 읽는 순간 터진다.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    volumes:
      - db-data:/var/lib/postgresql/data
      # 볼륨이 비었을 때만 돈다. Testcontainers 는 이 경로를 안 태워서 테스트 DB 는 그대로다.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shop} -d ${POSTGRES_DB:-shop}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 캐시와 짧은 수명의 상태를 담는다. Postgres 와 한 컨테이너에 넣지 않는다 —
  # 컨테이너 하나에 프로세스가 둘이면 하나가 죽어도 컨테이너는 살아 있어서 헬스체크가 무의미해지고,
  # 재시작·로그·버전 올리기가 전부 묶인다.
  #
  # 여기 담을 것과 안 담을 것의 기준은 "날아가면 사고인가" 다.
  # 판정 캐시(청크 39)와 로그인 실패 카운터(5c)는 날아가도 다시 만들면 되고,
  # 멱등키는 유실이 곧 중복 주문이라 Postgres 에 둔다(청크 10-0).
  #
  # **세션도 여기 있다**(`Q52`). 날아가면 전원 로그아웃인데, 그것은 재기동 때마다
  # 일어나던 일이라 나빠진 것이 아니다 — 대신 앱을 다시 띄워도 로그인이 유지된다.
  # `appendonly` 가 켜져 있어서 컨테이너를 껐다 켜도 남는다.
  redis:
    image: redis:7-alpine
    container_name: shop-redis
    restart: unless-stopped
    # appendonly 를 켠다. 유실돼도 치명적이지 않은 것만 담지만, 로컬은 재시작이 잦아서
    # 껐다 켤 때마다 로그인 차단이 풀리면 그 기능을 확인하기가 번거롭다.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  # 바깥에 알릴 사건을 나르는 브로커다(`33`, `event-catalog.md` 「전송 — Kafka」).
  #
  # **로컬에서만 돈다.** 배포에는 안 올린다 — 관리형 Kafka 가 과금이고 Railway 에 브로커가 없다
  # (사용자 결정 2026-09-14). 앱은 `EVENTS_SINK` 가 `kafka` 일 때만 이쪽을 본다.
  #
  # **ZooKeeper 가 없다**(KRaft). 한 프로세스가 브로커와 컨트롤러를 겸해서,
  # 옛 구성처럼 컨테이너를 둘 띄우지 않는다.
  #
  # **리스너가 둘인 이유**: 컨테이너 안에서 부르는 주소(`kafka:9092`)와 호스트에서 부르는
  # 주소(`localhost:9092`)가 달라서다. 하나로 두면 한쪽이 반드시 못 붙는다 —
  # 브로커는 붙은 클라이언트에게 "나한테 오려면 이 주소로 와라" 를 되돌려 주는데,
  # 그 값이 상대가 닿을 수 없는 이름이면 첫 요청만 성공하고 그다음이 전부 타임아웃이다.
  kafka:
    image: apache/kafka:4.3.1
    container_name: shop-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 노드가 하나라 복제본도 하나다. 기본값(3)을 그대로 두면 내부 표를 만들 때 터진다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      TZ: Asia/Seoul
    ports:
      - "${KAFKA_PORT:-9092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # 브로커에 실제로 질의를 던진다. 포트가 열린 것과 브로커가 답하는 것은 다르다.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 올라온 파일을 담는다(`26`, `media-rules.md`). S3 API 를 말하는 저장소라
  # 앱은 표준 S3 클라이언트 하나로 로컬과 배포를 같이 본다 — **배포는 Cloudflare R2 다**
  # (사용자 결정 2026-09-18). 갈리는 것은 엔드포인트와 키 셋뿐이고 코드는 같다.
  #
  # **버킷을 여기서 안 만든다.** 앱이 기동할 때 만들고 정책을 건다(`StorageBootstrap`) —
  # 컴포즈에 `mc` 한 컨테이너를 더 두면 **로컬에서만 참인 절차**가 생기고,
  # 배포에서는 사람이 콘솔로 같은 일을 다시 해야 한다. 절차가 두 벌이면 한쪽이 낡는다.
  #
  # **콘솔 포트를 연다.** 버킷이 정말 비공개인지 눈으로 볼 자리가 있어야
  # 「정책을 걸었다」와 「정책이 먹었다」를 가를 수 있다.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: shop-minio
    restart: unless-stopped
    # **quay.io 다.** Docker Hub 의 `minio/minio` 는 2025 에 없어졌다 — `docker pull` 이
    # 「repository does not exist」로 떨어진다. Testcontainers 의 `MinIOContainer` 기본값도
    # 그 좌표라 테스트에서 이미지를 명시한다(`stack.md`).
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-shop}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-shopshop}
      TZ: Asia/Seoul
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # MinIO 가 스스로 여는 준비 상태 경로다. 포트가 열린 것과 저장소가 받을 수 있는 것은 다르다.
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  redis-data:
  kafka-data:
  minio-data:
