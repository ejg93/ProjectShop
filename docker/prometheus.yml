# 로컬 관측(`63`). 컴포즈 `observe` 프로필의 Prometheus 가 읽는다.
#
# **둘을 긁는다** — 컴포즈 백엔드(`backend:9091`)와 호스트의 `bootRun`(`host.docker.internal:9091`).
# 떠 있는 쪽만 up 이 된다. 관리 포트는 `MANAGEMENT_SERVER_PORT` 를 준 프로세스만 연다 —
# `bootRun` 으로 보려면 그 환경변수를 주고 띄운다(`observability-rules.md` 「로컬에서 보는 법」).
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: shop-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:9091"]
        labels:
          source: compose
      - targets: ["host.docker.internal:9091"]
        labels:
          source: bootRun
